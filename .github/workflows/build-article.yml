
name: Build LaTeX Article

on:
  push:
    paths:
      - "article/**"
      - ".github/workflows/build-article.yml"
  pull_request:
    paths:
      - "article/**"
      - ".github/workflows/build-article.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile article with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: article/article.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: true
          extra_system_packages: font-liberation

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: scientific-article-pdf
          path: article/article.pdf
          if-no-files-found: error
